name: circles

x-backend: &backend
  build: .
  image: circles-app
  networks:
    - dokploy-network
  # Pin upstream resolvers: Docker snapshots the host's /etc/resolv.conf at
  # container start, and Tailscale rewrites it, so a restart at the wrong
  # moment left the containers with no external DNS. Service names still
  # resolve through Docker's embedded DNS.
  dns: &dns [1.1.1.1, 8.8.8.8]
  restart: unless-stopped
  environment: &backend-env
    NODE_ENV: production

services:
  migrate:
    <<: *backend
    command: bun apps/api/dist/migrate.js
    restart: "no"
    environment:
      <<: *backend-env
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?MIGRATE_DB_PASSWORD is required}

  api:
    <<: *backend
    command: bun apps/api/dist/index.js
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      <<: *backend-env
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SESSION_TOKEN_KEY: ${SESSION_TOKEN_KEY:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      TZ: ${TZ:-UTC}
      CLOUDFLARE_ACCESS_DISCOVERY_URL: ${CLOUDFLARE_ACCESS_DISCOVERY_URL:-}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${CLOUDFLARE_ACCESS_CLIENT_ID:-}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}

  worker:
    <<: *backend
    command: bun apps/worker/dist/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      SESSION_TOKEN_KEY: ${SESSION_TOKEN_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

  web:
    build: .
    image: circles-app
    command: bun apps/web/dist/server/entry.mjs
    expose: ["4321"]
    networks:
      - dokploy-network
    dns: *dns
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      EXTENSION_STORE_URL: ${EXTENSION_STORE_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

  # Daily logical dumps kept on the host (see docs/operations.md "Backups").
  # Checks hourly and dumps when the newest file is over 23 hours old, so
  # redeploys do not pile up extra dumps.
  backup:
    image: postgres:18-alpine
    networks:
      - dokploy-network
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -z "$$(find /backups -name 'circles-*.dump' -mmin -1380)" ]; then
            file=/backups/circles-$$(date -u +%Y%m%dT%H%M%SZ).dump
            if pg_dump --format=custom --file="$$file.partial" "$$DATABASE_URL"; then
              mv "$$file.partial" "$$file"
              find /backups -name 'circles-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
              echo "backup written: $$file ($$(du -h "$$file" | cut -f1))"
            else
              rm -f "$$file.partial"
              echo "backup failed" >&2
            fi
          fi
          sleep 3600
        done

volumes:
  backups:

networks:
  dokploy-network:
    external: true
