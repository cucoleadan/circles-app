<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Sleek dark base -->
  <rect width="48" height="48" rx="12" fill="#09090b" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="#27272a" stroke-width="1.5" />
  <!-- Outer circle -->
  <circle cx="24" cy="24" r="17" fill="none" stroke="url(#circleGrad)" stroke-width="2.2" stroke-opacity="0.95" />
  <!-- Middle circle -->
  <circle cx="24" cy="24" r="10.5" fill="none" stroke="url(#circleGrad)" stroke-width="2.2" stroke-opacity="0.85" />
  <!-- Center dot -->
  <circle cx="24" cy="24" r="3.8" fill="url(#circleGrad)" />
