# Publishes extension/circles-companion-<version>.zip as a GitHub Release
# whenever the extension version on main has no release yet.
name: Extension release

on:
  push:
    branches: [main]
    paths: [extension/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version extension/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "extension-v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.exists != 'true'
        with:
          bun-version-file: package.json
      - name: Pack and release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          (cd extension && bun run pack)
          gh release create "extension-v$VERSION" "extension/circles-companion-$VERSION.zip" \
            --title "Circles Companion $VERSION" \
            --notes "Chrome extension build. Unzip, open chrome://extensions, enable Developer mode, choose Load unpacked, then pair your Circles server from the popup." \
            --target "$GITHUB_SHA"
